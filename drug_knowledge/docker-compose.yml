services:
  db:
    image: postgres:16-alpine
    container_name: drug_knowledge_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: druguser
      POSTGRES_PASSWORD: drugpass
      POSTGRES_DB: drug_knowledge
    ports:
      - "5433:5432"        # 5433 on host to avoid clashing with any local postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U druguser -d drug_knowledge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
