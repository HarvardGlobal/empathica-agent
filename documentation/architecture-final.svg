<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1050" viewBox="0 0 1900 1050">
  <rect x="0" y="0" width="1900" height="1050" fill="#ffffff"/>
  <defs>
    <style>
      .title{font:700 40px Arial,sans-serif;fill:#0f172a}
      .sub{font:500 20px Arial,sans-serif;fill:#334155}
      .label{font:700 21px Arial,sans-serif;fill:#0f172a}
      .text{font:600 19px Arial,sans-serif;fill:#111827}
      .small{font:500 15px Arial,sans-serif;fill:#334155}

      .front{fill:#f8fbff;stroke:#1d4ed8;stroke-width:2.2;rx:12}
      .backend{fill:#fffaf5;stroke:#c2410c;stroke-width:2.2;rx:14}
      .gcp{fill:#f7fcf8;stroke:#15803d;stroke-width:2.3;rx:14}
      .nodeB{fill:#fffdf9;stroke:#ea580c;stroke-width:1.9;rx:10}
      .nodeG{fill:#f9fdfa;stroke:#15803d;stroke-width:1.9;rx:10}
      .tool{fill:#faf7ff;stroke:#7c3aed;stroke-width:2.0;rx:10}
      .safety{fill:#fff7f7;stroke:#b91c1c;stroke-width:2.2;rx:10}
      .data{fill:#f7fcfc;stroke:#0f766e;stroke-width:1.9;rx:10}
      .out{fill:#f7fcfa;stroke:#047857;stroke-width:2.0;rx:10}
    </style>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#6b7280"/></marker>
  </defs>

  <text x="950" y="58" text-anchor="middle" class="title">Empathica Technical Deployment Architecture</text>
  <text x="950" y="90" text-anchor="middle" class="sub">Clear end-to-end flow with backend data retrieval, cloud orchestration, safety, literacy, and tools</text>

  <!-- Frontend -->
  <rect x="70" y="390" width="260" height="130" class="front"/>
  <text x="200" y="442" text-anchor="middle" class="text">Frontend</text>
  <text x="200" y="468" text-anchor="middle" class="small">Web / App UI</text>

  <!-- Backend -->
  <rect x="390" y="220" width="620" height="600" class="backend"/>
  <text x="420" y="260" class="label" fill="#9a3412">Application Backend (separate service)</text>

  <rect x="450" y="320" width="500" height="110" class="nodeB"/>
  <text x="700" y="367" text-anchor="middle" class="text">Backend API</text>
  <text x="700" y="392" text-anchor="middle" class="small">Prompt intake, auth, request orchestration</text>

  <rect x="450" y="500" width="235" height="170" class="data"/>
  <text x="567" y="560" text-anchor="middle" class="text">MySQL</text>
  <text x="567" y="588" text-anchor="middle" class="small">Patient records</text>
  <text x="567" y="610" text-anchor="middle" class="small">FHIR-aligned schema</text>

  <rect x="715" y="500" width="235" height="170" class="data"/>
  <text x="832" y="560" text-anchor="middle" class="text">Backend Data Layer</text>
  <text x="832" y="588" text-anchor="middle" class="small">FHIR retrieval + mapping</text>
  <text x="832" y="610" text-anchor="middle" class="small">for agent payload</text>

  <!-- Google Cloud -->
  <rect x="1060" y="160" width="760" height="700" class="gcp"/>
  <text x="1090" y="200" class="label" fill="#14532d">Google Cloud (Vertex AI Agent Runtime)</text>

  <rect x="1130" y="270" width="620" height="125" class="nodeG"/>
  <text x="1440" y="320" text-anchor="middle" class="text">Orchestrator Agent (empathica_orchestrator)</text>
  <text x="1440" y="346" text-anchor="middle" class="small">Tool routing + response composition</text>

  <rect x="1130" y="410" width="620" height="55" class="nodeG"/>
  <text x="1440" y="444" text-anchor="middle" class="text">Orchestration System Prompts (Global Safety Rules)</text>

  <rect x="1130" y="478" width="620" height="70" class="safety"/>
  <text x="1440" y="521" text-anchor="middle" class="text" fill="#7f1d1d">Safety Override Logic + Literacy Level Decision (Critical)</text>

  <!-- 3 purple tool boxes -->
  <rect x="1140" y="585" width="185" height="130" class="tool"/>
  <text x="1232" y="638" text-anchor="middle" class="text">Tool</text>
  <text x="1232" y="664" text-anchor="middle" class="small">make_literacy_decision_tool</text>

  <rect x="1345" y="585" width="185" height="130" class="tool"/>
  <text x="1437" y="638" text-anchor="middle" class="text">Tool</text>
  <text x="1437" y="664" text-anchor="middle" class="small">drug_lookup</text>

  <rect x="1550" y="585" width="185" height="130" class="tool"/>
  <text x="1642" y="638" text-anchor="middle" class="text">Tool</text>
  <text x="1642" y="664" text-anchor="middle" class="small">get_patient_context</text>

  <rect x="70" y="600" width="260" height="120" class="out"/>
  <text x="200" y="667" text-anchor="middle" class="text">Final Response</text>

  <!-- clean connectors -->
  <polyline points="330,455 390,455 390,375 450,375" fill="none" stroke="#6b7280" stroke-width="3" marker-end="url(#arr)"/>

  <polyline points="700,430 700,500" fill="none" stroke="#6b7280" stroke-width="3" marker-end="url(#arr)"/>
  <polyline points="700,430 832,430 832,500" fill="none" stroke="#6b7280" stroke-width="3" marker-end="url(#arr)"/>

  <polyline points="950,375 1060,375 1060,330 1130,330" fill="none" stroke="#6b7280" stroke-width="3" marker-end="url(#arr)"/>
  <polyline points="1440,395 1440,410" fill="none" stroke="#6b7280" stroke-width="3" marker-end="url(#arr)"/>
  <polyline points="1440,465 1440,478" fill="none" stroke="#6b7280" stroke-width="3" marker-end="url(#arr)"/>

  <polyline points="1232,548 1232,585" fill="none" stroke="#6b7280" stroke-width="3" marker-end="url(#arr)"/>
  <polyline points="1437,548 1437,585" fill="none" stroke="#6b7280" stroke-width="3" marker-end="url(#arr)"/>
  <polyline points="1642,548 1642,585" fill="none" stroke="#6b7280" stroke-width="3" marker-end="url(#arr)"/>

  <polyline points="1130,340 1035,340 1035,885 360,885 360,660 330,660" fill="none" stroke="#6b7280" stroke-width="3" marker-end="url(#arr)"/>

  <text x="70" y="920" class="small">Flow: Frontend -> Backend API -> MySQL/FHIR data layer -> Orchestrator (Vertex AI) -> system safety prompts + safety/literacy decision -> tools -> final response.</text>
</svg>
