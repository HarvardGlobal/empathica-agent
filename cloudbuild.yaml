# CI/CD pipeline: build image -> push image -> deploy to Cloud Run
# Trigger this on push to main.

substitutions:
  _REGION: us-east4
  _AR_REPO: agents
  _SERVICE: empathica-agents
  _RUNTIME_SERVICE_ACCOUNT: empathica-agent-runtime-447@dci-chatbot-476416.iam.gserviceaccount.com
  _FHIR_PROJECT_ID: "dci-chatbot-476416"
  _FHIR_LOCATION: "us-east4"
  _FHIR_DATASET: "empathica_dev_dataset"
  _FHIR_STORE: "empathica_fhir_store"
  _PATIENT_DOCS_BUCKET: "empathica-patient-documents-dev-dci-chatbot-476416"
  _IDENTITY_MAP_COLLECTION: "patient_identity_map"
  _FIRESTORE_DATABASE_ID: "empathica-identity-map"

steps:
  - name: gcr.io/cloud-builders/docker
    id: Build Image
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    id: Push Image
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: Deploy Cloud Run
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --service-account
      - ${_RUNTIME_SERVICE_ACCOUNT}
      - --no-allow-unauthenticated
      - --port
      - "8080"
      - --set-env-vars
      - GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=us-central1,GOOGLE_GENAI_MODEL=gemini-2.5-flash,FHIR_PROJECT_ID=${_FHIR_PROJECT_ID},FHIR_LOCATION=${_FHIR_LOCATION},FHIR_DATASET=${_FHIR_DATASET},FHIR_STORE=${_FHIR_STORE},PATIENT_DOCS_BUCKET=${_PATIENT_DOCS_BUCKET},IDENTITY_MAP_COLLECTION=${_IDENTITY_MAP_COLLECTION},FIRESTORE_DATABASE_ID=${_FIRESTORE_DATABASE_ID}
timeout: 1200s

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA
