# CI/CD pipeline: build image -> push image -> deploy to Cloud Run
# Trigger this on push to main.

substitutions:
  _REGION: europe-west1
  _AR_REPO: empathica-agents
  _SERVICE: empathica-agents

steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: Ensure Artifact Registry Repo
    entrypoint: bash
    args:
      - -c
      - |
        gcloud artifacts repositories describe ${_AR_REPO} \
          --location=${_REGION} >/dev/null 2>&1 || \
        gcloud artifacts repositories create ${_AR_REPO} \
          --repository-format=docker \
          --location=${_REGION} \
          --description="Empathica ADK agent images"

  - name: gcr.io/cloud-builders/docker
    id: Build Image
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/empathica-agents:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    id: Push Image
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/empathica-agents:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: Deploy Cloud Run
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/empathica-agents:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --no-allow-unauthenticated
      - --port
      - "8080"
      - --set-env-vars
      - GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_REGION}

timeout: 1200s

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/empathica-agents:$COMMIT_SHA
